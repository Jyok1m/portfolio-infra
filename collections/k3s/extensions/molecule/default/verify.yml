---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: k3s binary is installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin
      failed_when: not k3s_bin.stat.exists

    - name: k3s reports the requested version
      ansible.builtin.command: /usr/local/bin/k3s --version
      register: k3s_version_out
      changed_when: false
      failed_when: "'v1.31.4+k3s1' not in k3s_version_out.stdout"

    - name: k3s systemd unit is laid down
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s.service
      register: k3s_unit
      failed_when: not k3s_unit.stat.exists
