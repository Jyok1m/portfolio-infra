---
- name: Converge
  hosts: all
  become: true
  tasks:
    - name: Apply the k3s agent role (skip start — k3s in DinD is unreliable)
      ansible.builtin.import_role:
        name: jyok1m.k3s.agent
      vars:
        k3s_version: v1.31.4+k3s1
        k3s_agent_server_url: https://fake-master.molecule.local:6443
        k3s_agent_token: K10fakemoleculetoken::server:fakeclustersecret
        k3s_agent_extra_env:
          INSTALL_K3S_SKIP_START: "true"
          INSTALL_K3S_SKIP_ENABLE: "true"
        k3s_agent_service_state: skip
        k3s_agent_service_enabled: false
