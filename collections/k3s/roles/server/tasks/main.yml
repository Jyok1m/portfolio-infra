---
- name: Install APT prerequisites
  ansible.builtin.apt:
    name: "{{ k3s_server_prerequisites }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Download the k3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "{{ k3s_install_script_path }}"
    mode: "0755"

- name: Check whether the k3s binary is already present
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: _k3s_server_binary

- name: Read the installed k3s version (if any)
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: _k3s_server_version
  changed_when: false
  failed_when: false
  when: _k3s_server_binary.stat.exists

- name: Install or upgrade k3s server
  ansible.builtin.command: "{{ k3s_install_script_path }}"
  environment: >-
    {{ {
         'INSTALL_K3S_VERSION': k3s_version,
         'INSTALL_K3S_EXEC': ('server ' ~ k3s_server_exec_args) | trim,
       }
       | combine({'K3S_TOKEN': k3s_server_token} if k3s_server_token | length > 0 else {})
       | combine(k3s_server_extra_env) }}
  when: >-
    not _k3s_server_binary.stat.exists
    or (k3s_version | length > 0
        and k3s_version not in (_k3s_server_version.stdout | default('')))
  changed_when: true

- name: Ensure k3s server is started and enabled
  ansible.builtin.service:
    name: k3s
    state: "{{ k3s_server_service_state }}"
    enabled: "{{ k3s_server_service_enabled }}"
  when: k3s_server_service_state != 'skip'

- name: Check whether the node-token file has been created
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/node-token
  register: _k3s_server_node_token_file

- name: Read the cluster node-token (used by agents to join)
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: _k3s_server_node_token_slurp
  when: _k3s_server_node_token_file.stat.exists

- name: Expose the node-token as a host fact
  ansible.builtin.set_fact:
    k3s_server_node_token: "{{ _k3s_server_node_token_slurp.content | b64decode | trim }}"
  when: _k3s_server_node_token_file.stat.exists

- name: Show the auto-generated node-token (store this in your vault)
  ansible.builtin.debug:
    msg:
      - "============================================================"
      - "k3s auto-generated this cluster node-token:"
      - ""
      - "    {{ k3s_server_node_token }}"
      - ""
      - "Store it in your vault (e.g. k3s_token in group_vars/<group>/vault.yml)"
      - "and pass it as k3s_server_token / k3s_agent_token on future runs."
      - "Once vaulted, this message will no longer be displayed."
      - "============================================================"
  when:
    - k3s_server_node_token is defined
    - k3s_server_token | length == 0
