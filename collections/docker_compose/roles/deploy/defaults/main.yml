---
# Required
docker_compose_app_name: ""

# Paths
docker_compose_app_path: "{{ app_base_path | default('/opt') }}/{{ docker_compose_app_name }}"
docker_compose_dir_mode: "0755"

# Jinja templates (resolved against the calling role)
# Item shape: { src, dest, mode (optional), no_log (optional) }
docker_compose_templates: []

# Static files copied as-is
# Item shape: { src, dest, mode (optional) }
docker_compose_files: []

# Compose behavior
docker_compose_pull: true
docker_compose_remove_orphans: true
docker_compose_wait_timeout: 120
docker_compose_logs_tail: 100
