---
- name: "[{{ mongo_restore_name }}] Validate inputs"
  ansible.builtin.assert:
    that:
      - mongo_restore_name | length > 0
      - mongo_restore_name is match('^[a-z0-9][a-z0-9_-]*$')
      - mongo_restore_username | length > 0
      - mongo_restore_password | length > 0
      - mongo_restore_restic_repo | length > 0
      - mongo_restore_restic_password | length > 0
    fail_msg: >-
      mongo_restore requires mongo_restore_name (a-z0-9_-), Mongo credentials,
      and a restic repository + password.
    quiet: true

- name: "[{{ mongo_restore_name }}] Install host packages"
  ansible.builtin.apt:
    name: "{{ mongo_restore_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "[{{ mongo_restore_name }}] Ensure local working directory exists"
  ansible.builtin.file:
    path: "{{ mongo_restore_local_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: "[{{ mongo_restore_name }}] Render restic + Mongo env file"
  ansible.builtin.template:
    src: restore.env.j2
    dest: "/etc/mongo-restore-{{ mongo_restore_name }}.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: "[{{ mongo_restore_name }}] Render restore script"
  ansible.builtin.template:
    src: restore.sh.j2
    dest: "/usr/local/bin/mongo-restore-{{ mongo_restore_name }}.sh"
    owner: root
    group: root
    mode: "0750"
