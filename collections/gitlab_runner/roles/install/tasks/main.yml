---
- name: "[gitlab_runner] Validate inputs"
  ansible.builtin.assert:
    that:
      - gitlab_runner_token | length > 0
      - gitlab_runner_token is match('^glrt-')
      - gitlab_runner_url | length > 0
    fail_msg: >-
      gitlab_runner_token must be a gitlab.com authentication token (starts
      with 'glrt-') created from the UI, and gitlab_runner_url must be set.
    quiet: true

- name: "[gitlab_runner] Install apt prerequisites"
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "[gitlab_runner] Ensure /etc/apt/keyrings exists"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "[gitlab_runner] Fetch GitLab Runner apt signing key"
  ansible.builtin.get_url:
    url: "{{ gitlab_runner_apt_gpg_url }}"
    dest: "{{ gitlab_runner_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"
    force: false

- name: "[gitlab_runner] Add GitLab Runner apt repository"
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ gitlab_runner_apt_keyring }}]
      {{ gitlab_runner_apt_repo_url }}
      {{ gitlab_runner_apt_distribution }} main
    state: present
    filename: gitlab-runner
    update_cache: true

- name: "[gitlab_runner] Install gitlab-runner package"
  ansible.builtin.apt:
    name: gitlab-runner
    state: present

- name: "[gitlab_runner] Add gitlab-runner user to docker group"
  ansible.builtin.user:
    name: gitlab-runner
    groups: docker
    append: true
  when: gitlab_runner_join_docker_group | bool
  notify: Restart gitlab-runner

- name: "[gitlab_runner] Ensure /etc/gitlab-runner exists"
  ansible.builtin.file:
    path: /etc/gitlab-runner
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: "[gitlab_runner] Render config.toml"
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/gitlab-runner/config.toml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart gitlab-runner

- name: "[gitlab_runner] Apply pending unit changes"
  ansible.builtin.meta: flush_handlers

- name: "[gitlab_runner] Enable and start gitlab-runner service"
  ansible.builtin.systemd_service:
    name: gitlab-runner
    state: "{{ gitlab_runner_service_state }}"
    enabled: "{{ gitlab_runner_service_enabled }}"
