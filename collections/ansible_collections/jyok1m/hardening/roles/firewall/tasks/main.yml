---
- name: Install UFW via APT
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Allow configured ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ ufw_allowed_ports }}"

- name: Set default ingress policy
  community.general.ufw:
    default: "{{ ufw_default_incoming }}"
    direction: incoming

- name: Set default egress policy
  community.general.ufw:
    default: "{{ ufw_default_outgoing }}"
    direction: outgoing

- name: Configure UFW logging
  community.general.ufw:
    logging: "{{ ufw_logging }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
