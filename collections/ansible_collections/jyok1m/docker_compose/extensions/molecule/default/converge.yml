---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Ensure /etc/docker exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Configure inner Docker daemon for DinD (vfs storage avoids overlay-on-overlay)
      ansible.builtin.copy:
        content: |
          {
            "storage-driver": "vfs",
            "features": {
              "containerd-snapshotter": false
            }
          }
        dest: /etc/docker/daemon.json
        mode: "0644"

    - name: Download Docker install script
      ansible.builtin.get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: "0755"

    - name: Install Docker engine and Compose v2 plugin
      ansible.builtin.command: sh /tmp/get-docker.sh
      args:
        creates: /usr/bin/docker

    - name: Ensure Docker is running
      ansible.builtin.service:
        name: docker
        state: started
  tasks:
    - name: Apply deploy role with a tiny test stack
      ansible.builtin.import_role:
        name: jyok1m.docker_compose.deploy
      vars:
        docker_compose_app_name: molecule_test
        docker_compose_app_path: /opt/molecule_test
        docker_compose_pull: false
        docker_compose_templates:
          - src: docker-compose.yml.j2
            dest: docker-compose.yml
