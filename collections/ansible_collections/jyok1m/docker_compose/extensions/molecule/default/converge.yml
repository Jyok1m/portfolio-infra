---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Install Docker engine and Compose v2 plugin
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Ensure Docker is running
      ansible.builtin.service:
        name: docker
        state: started
  tasks:
    - name: Apply deploy role with a tiny test stack
      ansible.builtin.import_role:
        name: jyok1m.docker_compose.deploy
      vars:
        docker_compose_app_name: molecule_test
        docker_compose_app_path: /opt/molecule_test
        docker_compose_pull: false
        docker_compose_templates:
          - src: docker-compose.yml.j2
            dest: docker-compose.yml
