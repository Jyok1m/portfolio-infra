---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check that docker-compose.yml is rendered
      ansible.builtin.stat:
        path: /opt/molecule_test/docker-compose.yml
      register: compose_file
      failed_when: not compose_file.stat.exists

    - name: Check that the hello service is running
      ansible.builtin.command: docker compose ps --status running --quiet
      args:
        chdir: /opt/molecule_test
      register: running
      changed_when: false
      failed_when: running.stdout | length == 0
