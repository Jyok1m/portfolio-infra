---
- name: Provision portfolio-infra on the OVH host
  hosts: ovh_host
  pre_tasks:
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: always
  roles:
    # Initial setup
    - { role: hardening, tags: [setup, hardening] }
    - { role: docker, tags: [setup, docker] }

    # Common apps via Docker
    - { role: traefik, tags: [common, traefik] }
    - { role: jenkins, tags: [common, jenkins] }
    - { role: monitoring, tags: [common, monitoring] }

    # Client apps
    - { role: portfolio, tags: [apps, portfolio] }
    - { role: ipseis, tags: [apps, ipseis] }

    # DB Test
    - { role: mongo_test, tags: [test, mongo_test] }
