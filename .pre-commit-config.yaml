---
default_install_hook_types:
  - pre-commit

repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c=.yamllint"]

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.4.0
    hooks:
      - id: ansible-lint
        files: \.(yaml|yml)$

  - repo: local
    hooks:
      - id: forbid-plaintext-vault
        name: Refuse plaintext vault files
        entry: |
          bash -c 'for f in "$@"; do head -1 "$f" | grep -q "^\$ANSIBLE_VAULT" || { echo "ERROR: $f is not encrypted"; exit 1; }; done' --
        language: system
        files: ^(group_vars/infra/vault\.yml|host_vars/main-host/vault\.yml)$
