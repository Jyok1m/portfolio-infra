---
- name: Création du répertoire de déploiement
  ansible.builtin.file:
    path: "{{ app_base_path }}/ipseis"
    state: directory
    mode: "0755"

- name: Application du template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_base_path }}/ipseis/docker-compose.yml"
    mode: "0644"
  no_log: true

- name: Déploiement via docker compose
  ansible.builtin.include_role:
    name: utils.compose_deploy
  vars:
    compose_deploy_app_name: ipseis
