---
- name: Render Jenkins Dockerfile from template
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ app_path }}/Dockerfile"
    mode: "0644"

- name: Build and push the Jenkins image
  community.docker.docker_image:
    name: "{{ jenkins_image_name }}"
    tag: "{{ jenkins_image_tag }}"
    build:
      path: "{{ app_path }}"
      dockerfile: Dockerfile
      pull: true
    source: build
    push: true
    force_source: false

- name: Deploy {{ app_name }}
  ansible.builtin.import_role:
    name: jyok1m.docker_compose.deploy
  vars:
    docker_compose_app_name: "{{ app_name }}"
    docker_compose_app_path: "{{ app_path }}"
    docker_compose_templates:
      - src: docker-compose.yml.j2
        dest: docker-compose.yml
        no_log: true

- name: Check whether the Jenkins container has a known_hosts file
  community.docker.docker_container_exec:
    container: jenkins-gui
    command: test -f /var/jenkins_home/.ssh/known_hosts
  register: known_hosts_check
  failed_when: false
  changed_when: false

- name: Initialize known_hosts with GitHub key inside the Jenkins container
  community.docker.docker_container_exec:
    container: jenkins-gui
    user: root
    command: >-
      bash -c "mkdir -p /var/jenkins_home/.ssh &&
      ssh-keyscan -t ed25519 github.com >> /var/jenkins_home/.ssh/known_hosts &&
      chown -R jenkins:jenkins /var/jenkins_home/.ssh"
  when: known_hosts_check.rc != 0
  changed_when: true

- name: Ensure jenkins system user exists on the host
  ansible.builtin.user:
    name: jenkins
    shell: /bin/bash
    create_home: true
    groups: docker
    append: true

- name: Check whether the Jenkins container has a deploy keypair
  community.docker.docker_container_exec:
    container: jenkins-gui
    command: test -f /var/jenkins_home/.ssh/deploy_key
  register: deploy_key_check
  failed_when: false
  changed_when: false

- name: Generate the deploy SSH keypair inside the Jenkins container
  community.docker.docker_container_exec:
    container: jenkins-gui
    user: root
    command: >-
      bash -c "mkdir -p /var/jenkins_home/.ssh &&
      ssh-keygen -t ed25519 -C 'jenkins-deploy' -f /var/jenkins_home/.ssh/deploy_key -N '' &&
      chown -R jenkins:jenkins /var/jenkins_home/.ssh"
  when: deploy_key_check.rc != 0
  changed_when: true

- name: Read the deploy public key from the Jenkins container
  community.docker.docker_container_exec:
    container: jenkins-gui
    command: cat /var/jenkins_home/.ssh/deploy_key.pub
  register: deploy_pub_key
  changed_when: false

- name: Authorize the deploy key for the jenkins user on the host
  ansible.posix.authorized_key:
    user: jenkins
    key: "{{ deploy_pub_key.stdout }}"
    state: present

- name: Inspect the jenkins-internal Docker network
  community.docker.docker_network_info:
    name: jenkins-internal
  register: jenkins_network

- name: Set the docker gateway fact
  ansible.builtin.set_fact:
    jenkins_docker_gateway: "{{ jenkins_network.network.IPAM.Config[0].Gateway }}"

- name: Check whether the gateway is already in the Jenkins known_hosts
  community.docker.docker_container_exec:
    container: jenkins-gui
    command: grep -q "{{ jenkins_docker_gateway }}" /var/jenkins_home/.ssh/known_hosts
  register: host_known_check
  failed_when: false
  changed_when: false

- name: Add the docker gateway to the Jenkins known_hosts
  community.docker.docker_container_exec:
    container: jenkins-gui
    user: root
    command: >-
      bash -c "ssh-keyscan -t ed25519 -p {{ ovh_portfolio_port }} {{ jenkins_docker_gateway }} >> /var/jenkins_home/.ssh/known_hosts &&
      chown jenkins:jenkins /var/jenkins_home/.ssh/known_hosts"
  when: host_known_check.rc != 0
  changed_when: true
